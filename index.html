:root{
  --paper:#F3F8F4;--card:#FFFFFF;--ink:#1E2B23;--muted:#5C6E62;--line:#DFE8E1;--soft:#EAF1EC;
  --grass:#2F9E48;--grass-deep:#23803A;--grass-tint:#E3F3E6;--sky:#2B8FD6;--sky-deep:#1F6FAB;--sky-tint:#E2F0FB;
  --brand:#477563;--brand2:#2F6B4F;--brand-ink:#FFFFFF;--bad:#B3261E;--bad-tint:#FCE8E6;--ok:#23703A;--ok-tint:#E3F3E6;
  --warn:#7A5A00;--warn-tint:#FDF0C4;--input:#E4F2E7;
  --shadow:0 1px 0 rgba(30,43,35,.05),0 8px 22px -12px rgba(30,43,35,.28);
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-look=light]){
  --paper:#0E1612;--card:#17221C;--ink:#EAF2EC;--muted:#A3B5A9;--line:#28352D;--soft:#1D2922;
  --grass:#63C977;--grass-deep:#7FD690;--grass-tint:#1D3A26;--sky:#62B6F0;--sky-deep:#8CCBF5;--sky-tint:#173048;
  --brand:#1F3A2C;--brand2:#16301F;--brand-ink:#EAF2EC;--bad:#F28B82;--bad-tint:#3A2422;--ok:#9FD9AC;--ok-tint:#1D3A26;
  --warn:#FFD86B;--warn-tint:#3E3412;--input:#1F3A28;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-look=dark]{
  --paper:#0E1612;--card:#17221C;--ink:#EAF2EC;--muted:#A3B5A9;--line:#28352D;--soft:#1D2922;
  --grass:#63C977;--grass-deep:#7FD690;--grass-tint:#1D3A26;--sky:#62B6F0;--sky-deep:#8CCBF5;--sky-tint:#173048;
  --brand:#1F3A2C;--brand2:#16301F;--brand-ink:#EAF2EC;--bad:#F28B82;--bad-tint:#3A2422;--ok:#9FD9AC;--ok-tint:#1D3A26;
  --warn:#FFD86B;--warn-tint:#3E3412;--input:#1F3A28;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{margin:0;font:800 30px/1.05 var(--cond);letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--cond);color:var(--muted);white-space:nowrap}
.brand svg{width:26px;height:26px}
.banner{background:var(--sky-tint);color:var(--sky-deep);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
h2{font:800 22px/1.15 var(--cond);margin:22px 0 10px}
h3{font:600 17px/1.2 var(--cond);margin:0 0 6px;letter-spacing:.2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.neg{color:var(--bad)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
@media (min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}

/* screen change */
.screen.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Home: the month board with a living sky */
.board{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:var(--brand-ink);border-radius:20px;padding:18px 18px 8px;position:relative;overflow:hidden;isolation:isolate}
.board .deco{position:absolute;inset:0;z-index:-1;pointer-events:none}
.board .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.board .lab{font-size:14px;opacity:.85}
.board .big{font:800 54px/1 var(--cond);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.board .side{display:flex;gap:18px}
.board .side div{min-width:84px}
.board .side b{display:block;font:800 26px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.board .side b.neg{color:#FFB4AB}
.board svg.chart{display:block;width:100%;height:132px;margin-top:6px;overflow:visible}
.board .months{display:flex;justify-content:space-between;font-size:12px;opacity:.8;padding:0 2px 4px}
.board .legend{display:flex;gap:14px;font-size:12px;opacity:.9;padding:0 2px 6px}
.board .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.blade{transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.leaf{animation:fall 9s linear infinite both}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(-60px,260px) rotate(320deg)}}
.flake{animation:snow 10s linear infinite both}
@keyframes snow{0%{transform:translate(0,-20px)}100%{transform:translate(18px,260px)}}
.sun-g{animation:glow 6s ease-in-out infinite;transform-origin:center}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
/* chart drawing */
.anim .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.3,.6,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.anim .area{transform-origin:50% 100%;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.anim .dot{animation:pop .4s ease-out 1.35s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.dot{transform-box:fill-box;transform-origin:center}
/* ring */
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:800 28px/1 var(--cond)}
.ring .c span{font-size:12px;color:var(--muted)}
.fc{display:flex;gap:16px;align-items:center}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.stat:last-child{border-bottom:0}
.stat b{font:800 20px var(--cond)}
.bar{height:7px;border-radius:4px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--grass);transform-origin:0 50%}
.bar i.sky{background:linear-gradient(90deg,var(--grass),var(--sky))}
.anim .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.anim .rank:nth-child(2) .bar i{animation-delay:.08s}.anim .rank:nth-child(3) .bar i{animation-delay:.16s}
.anim .rank:nth-child(4) .bar i{animation-delay:.24s}.anim .rank:nth-child(5) .bar i{animation-delay:.32s}.anim .rank:nth-child(6) .bar i{animation-delay:.4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.rank{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .bar{grid-column:1/-1;margin-top:2px}
.rank b{font:800 18px var(--cond)}
.look{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.look:last-child{border-bottom:0}
.look b{font:800 22px var(--cond);color:var(--ok)}
.look b.n{color:var(--bad)}
.look b.w{color:var(--warn)}

/* pills */
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.wait{background:var(--soft);color:var(--muted)}
.pill.info{background:var(--sky-tint);color:var(--sky-deep)}

/* Today: the route */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 12px}
.dayhead h2{margin:0}
.progress{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--sky));border-radius:5px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.route{position:relative;padding-left:46px;overflow-x:clip}
.route::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:4px;border-radius:2px;
  background:repeating-linear-gradient(to bottom,var(--line) 0 8px,transparent 8px 14px)}
.route .trail{position:absolute;left:19px;top:22px;width:4px;border-radius:2px;background:var(--grass);transition:height .8s cubic-bezier(.2,.7,.2,1)}
.mower{position:absolute;left:3px;width:36px;height:36px;z-index:2;transition:top .8s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.mower .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite;animation-play-state:paused}

.up{color:var(--ok)}
.stop .pr div{margin-top:5px}
.linkb{border:0;background:none;color:var(--sky-deep);text-decoration:underline;padding:0 2px;font-size:14px}
.linkrow{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink);font-size:16px}
.li .acts2{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.li .acts2 .btn{min-height:38px;padding:6px 16px}
.vbars{display:flex;align-items:stretch;gap:6px;height:160px;padding-top:6px}

.vb i{display:block;width:100%;max-width:14px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--sky),var(--grass));transform-origin:50% 100%}
.anim .vb i{animation:riseb .8s cubic-bezier(.2,.7,.2,1) both}

.tile,.stop,.look{transition:transform .15s ease-out}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .anim .draw{stroke-dashoffset:0}

<script>/* Lawn & Landscape Tracker: the app's math. Same rules as the spreadsheet (build/model.py), checked by test.js. */
(function (root) {
  "use strict";
  var FREQS = [["Weekly", 7], ["Every 2 weeks", 14], ["Every 3 weeks", 21], ["Every 4 weeks", 28], ["On call", 0], ["One-off", 0]];
  var FREQ = {}; FREQS.forEach(function (f) { FREQ[f[0]] = f[1]; });
  var METHODS = ["Per visit", "Per hour", "Per 1,000 sq ft", "Per item"];

  function d2n(iso) { var p = iso.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
  function n2d(n) { return new Date(Math.round(n) * 864e5).toISOString().slice(0, 10); }
  function addDays(iso, k) { return n2d(d2n(iso) + k); }
  function monthStart(iso) { return iso.slice(0, 7) + "-01"; }
  function addMonths(iso, k) { var y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + k;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + String(m + 1).padStart(2, "0") + "-01"; }
  function weekday(iso) { return (new Date(d2n(iso) * 864e5).getUTCDay() + 6) % 7; } // Mon = 0
  function num(x) { return typeof x === "number" && isFinite(x) ? x : 0; }
  function roundup(x, step) { if (!step) return x; return Math.ceil(Math.round(x / step * 1e9) / 1e9) * step; }

  function quotePrice(svc, qty, qround, extra, travel) {
    if (!svc) return null;
    var base = svc.meth === "Per 1,000 sq ft" ? qty / 1000 * svc.rate : qty * svc.rate;
    return roundup(Math.max(num(svc.min), base) * (1 + num(extra)), qround) + num(travel);
  }

  function compute(S, today) {
    var T = S.settings, asof = S.asOf || today, out = {};
    var svc = {}; S.services.forEach(function (s) { if (s.name) svc[s.name] = s; });
    var cl = {}; S.clients.forEach(function (c) { if (c.name) cl[c.name] = c; });
    // jobs
    out.jobs = S.jobs.map(function (j) {
      var c = cl[j.client] || {};
      var p = j.price != null ? j.price : num(c.price);
      var helper = num(j.helper) * T.crew;
      var fee = j.pay === "Card" ? p * T.card_pct + T.card_fix : 0;
      var profit = p - helper - fee - num(j.mat) - num(j.dump);
      var pph = j.hours > 0 ? profit / j.hours : 0;
      var age = d2n(asof) - d2n(j.date);
      var pill = j.paid === "Yes" ? "✓ Paid" : age > T.overdue ? "▲ Overdue " + age + " days" : "● Unpaid";
      return { id: j.id, date: j.date, client: j.client, svc: j.svc, p: p, helper_cost: helper, fee: fee, profit: profit, pph: pph,
        unpaid: j.paid === "Yes" ? 0 : p, pill: pill, hours: num(j.hours), cost: helper + fee + num(j.mat) + num(j.dump) };
    });
    // clients
    var byC = {}; out.jobs.forEach(function (j) { (byC[j.client] = byC[j.client] || []).push(j); });
    out.clients = S.clients.map(function (c) {
      var mine = byC[c.name] || [], visits = 0, rev = 0, prof = 0, hrs = 0, unpaid = 0, last = null;
      mine.forEach(function (j) { rev += j.p; prof += j.profit; hrs += j.hours; unpaid += j.unpaid;
        if (j.date <= asof) { visits++; if (!last || j.date > last) last = j.date; } });
      var fd = FREQ[c.freq] || 0, next = null;
      if (c.status === "Active" && fd > 0) {
        var a = last ? addDays(last, fd) : null, b = c.start || null;
        next = a && b ? (a > b ? a : b) : (a || b);
      }
      var pph = hrs ? prof / hrs : null, pp;
      if (!hrs) pp = "● No visits yet"; else if (pph >= T.target) pp = "✓ Good price";
      else if (pph >= T.target * (1 - T.close)) pp = "● Close"; else pp = "▲ Underpriced";
      var vp = "";
      if (next) vp = next < asof ? "● Missed" : d2n(next) - d2n(asof) <= 6 ? "Due this week" : "Later";
      return { id: c.id, name: c.name, visits: visits, rev: rev, profit: prof, hours: hrs, pph: pph, unpaid: unpaid, last: last,
        next: next, ppill: pp, vpill: vp, status: c.status, price: c.price, svc: c.svc };
    });
    // services (all time)
    out.services = S.services.map(function (s) {
      var n = 0, rev = 0, hrs = 0, prof = 0;
      out.jobs.forEach(function (j) { if (j.svc === s.name) { n++; rev += j.p; hrs += j.hours; prof += j.profit; } });
      var pph = hrs ? prof / hrs : null;
      var pill = !hrs ? "" : pph >= T.target ? "✓ Good" : pph >= T.target * (1 - T.close) ? "● Close" : "▲ Low";
      return { name: s.name, jobs: n, rev: rev, hours: hrs, profit: prof, pph: pph, pill: pill };
    });
    // quotes
    var won = 0, lost = 0, fu = 0;
    out.quotes = S.quotes.map(function (q) {
      var calc = quotePrice(svc[q.svc], q.size, T.qround, 0, 0), used = q.price != null ? q.price : calc;
      var pill = q.status === "Won" ? "✓ Won" : q.status === "Lost" ? "Lost" : q.follow && q.follow <= asof ? "● Follow up" : "Waiting";
      if (q.status === "Won") won++; if (q.status === "Lost") lost++; if (pill === "● Follow up") fu++;
      return { id: q.id, calc: calc, used: used, pill: pill };
    });
    out.winrate = won + lost ? won / (won + lost) : 0;
    out.followups = fu;
    out.mileage = S.mileage.map(function (m) { return num(m.dist) * T.mile_rate; });
    // equipment
    out.equipment = S.equipment.map(function (e) {
      var nd = e.svc_days && e.last ? addDays(e.last, e.svc_days) : null, hs = 0, ds = 0;
      if (e.svc_hours) hs = e.hours >= e.svc_hours ? 2 : e.hours >= 0.85 * e.svc_hours ? 1 : 0;
      if (nd) ds = nd <= asof ? 2 : d2n(nd) - d2n(asof) <= T.soon ? 1 : 0;
      return { id: e.id, next: nd, pill: ["✓ OK", "● Soon", "▲ Service now"][Math.max(hs, ds)] };
    });
    // schedule: Monday-start week holding `week` (default asof); missed visits before it too
    var wk = S.week || asof, ws = addDays(wk, -weekday(wk)), we = addDays(ws, 7);
    var rows = [];
    out.clients.forEach(function (c, i) { if (c.next && c.next < we) rows.push({ name: c.name, id: c.id, next: c.next, price: c.price, late: c.next < ws, i: i }); });
    rows.sort(function (a, b) { return a.next < b.next ? -1 : a.next > b.next ? 1 : a.i - b.i; });
    out.schedule = { start: ws, rows: rows };
    // 12 months ending at the dashboard month
    var dm = S.dashMonth || monthStart(asof), months = [];
    for (var k = -11; k <= 0; k++) {
      var a = addMonths(dm, k), b = addMonths(dm, k + 1), rev = 0, jc = 0, hrs = 0, exp = 0, n = 0;
      out.jobs.forEach(function (j) { if (j.date >= a && j.date < b) { rev += j.p; jc += j.cost; hrs += j.hours; n++; } });
      S.expenses.forEach(function (x) { if (x.date >= a && x.date < b) exp += num(x.amount); });
      months.push({ start: a, rev: rev, jc: jc, hours: hrs, exp: exp, profit: rev - jc - exp, pph: hrs ? (rev - jc) / hrs : 0, jobs: n });
    }
    out.dmonths = months;
    var cur = months[11];
    var unpaidCl = out.clients.filter(function (c) { return c.unpaid > 0; }).map(function (c) { return [c.unpaid, c.name]; })
      .sort(function (x, y) { return y[0] - x[0]; });
    var yStart = dm.slice(0, 4) + "-01-01", yEnd = addMonths(dm, 1), tops = [];
    S.services.forEach(function (s) { var h = 0, p = 0;
      out.jobs.forEach(function (j) { if (j.svc === s.name && j.date >= yStart && j.date < yEnd) { h += j.hours; p += j.profit; } });
      if (h) tops.push([p / h, s.name]); });
    tops.sort(function (x, y) { return y[0] - x[0]; });
    out.dash = { month: dm, rev: cur.rev, profit: cur.profit, pph: cur.pph, jobs: cur.jobs,
      unpaid: out.jobs.reduce(function (t, j) { return t + j.unpaid; }, 0), winrate: out.winrate,
